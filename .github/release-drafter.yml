name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feat"
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "dependencies"
      - "ci"
  - title: "📝 Documentation"
    labels:
      - "docs"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feat"
      - "enhancement"
  patch:
    labels:
      - "fix"
      - "bug"
      - "docs"
      - "chore"
      - "ci"
  default: patch
